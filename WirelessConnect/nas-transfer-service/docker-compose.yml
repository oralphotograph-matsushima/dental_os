version: '3.8'

services:
  nas-transfer-service:
    build: .
    container_name: oralnote-nas-transfer
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      # NAS内の写真受信フォルダ (Staging / Inbox)
      - ./inbox:/app/inbox
      # NAS内のOralNoteデータ保存先 (Patients/ や Unassigned/ を含むフォルダ)
      - ./data:/app/data
      # 設定ファイルの永続化
      - ./config:/app/config
    environment:
      - PYTHONUNBUFFERED=1
      - WATCH_DIR=/app/inbox
      - DATA_DIR=/app/data
      - CONFIG_PATH=/app/config/config.json
